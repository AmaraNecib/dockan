# Local equivalent:
#   bun install --frozen-lockfile
#   bun run typecheck && bun run lint && bun run test && bun run skills:check
#   bun audit
#   bunx playwright install --with-deps chromium && bun run test:e2e
#   bun run --filter @dokan/web build
#   (cd apps/desktop/src-tauri && cargo test && cargo clippy -- -D warnings)
#
# Action refs are pinned to full commit SHAs (a mutable tag can be moved to
# untrusted code); the trailing comment names the release each SHA is from.
#
# PR scope (issue 226): a `changes` job turns the diff into an e2e scope and a
# rust on/off decision, so a docs-only or a web-only PR does not pay for the
# Windows crate build, and a feature PR runs only the specs its paths reach.
# The push-to-develop run stays full: it is the only run that sees the exact
# merged tree. Precedence in the map is critical -> feature -> skip -> full, so
# a path the map does not know costs minutes, never coverage.
#
# #231 review fixes, all in this file: the diff is collected with `--no-renames`
# so both sides of a move are seen, the PR trigger subscribes to `labeled` so the
# `e2e:full` escape hatch starts a run, and the scope summary is published by
# `changes` so a `skip` decision is explained on the run itself.
name: CI

on:
  pull_request:
    branches: [develop]
    # `labeled` is the `e2e:full` escape hatch: GitHub dispatches no event for a
    # label change unless it is listed, so without it adding the label to an
    # open PR starts nothing. Listing `types:` replaces the default set
    # (opened, synchronize, reopened), so all four are named.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop]
  # Manual escape hatch: a dispatch re-runs every suite whatever the diff says,
  # so a human who distrusts the selector is never stuck. It carries no input,
  # because a hand-typed scope would be an unrecorded override of the map.
  workflow_dispatch:

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap (~10 s) decision job. Every heavy job reads its outputs instead of
  # repeating the diff logic, so there is exactly one place that can be wrong.
  # It deliberately runs the checked-in selector rather than trusting a free-text
  # input: the only overrule is the `e2e:full` label, and it is recorded on the PR.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      e2e_mode: ${{ steps.decide.outputs.e2e_mode }}
      e2e_specs: ${{ steps.decide.outputs.e2e_specs }}
      e2e_reason: ${{ steps.decide.outputs.e2e_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs history: the base commit is not always reachable from
          # the shallow default clone.
          fetch-depth: 0

      # setup-bun reads packageManager (bun@1.4.3) from package.json,
      # so CI tracks the repo's bun pin without a second source of truth.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Compute the changed-file list
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}" ;;
            push)         base="${{ github.event.before }}";                  head="${{ github.sha }}" ;;
            *)            base=""; head="" ;;
          esac
          # A zeroed `before` means a new branch, and an empty pair means we
          # cannot prove what moved. Both must degrade to "assume everything".
          if [ -z "$head" ] || [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            printf '*\n' > changed.txt
          else
            # Diff from the merge base, not the base tip: a two-dot diff against
            # a base branch that moved on would list that branch's own commits
            # as if this PR made them. If merge-base itself fails (unrelated
            # histories) the tip is the fallback, which can only over-list.
            root="$(git merge-base "$base" "$head" 2>/dev/null || echo "$base")"
            # `--no-renames` lists a detected rename as a delete plus an add.
            # Without it the diff reports only the destination, so a file moved
            # out of `apps/desktop/src-tauri/**` would list its ungated
            # destination and the rust gate would skip a crate that just lost a
            # file. Both directions are therefore listed and run the gate; a
            # rename can only over-run it, never under-run it.
            git diff --no-renames --name-only "$root" "$head" > changed.txt
          fi
          echo "--- changed files ---"; cat changed.txt

      - name: Decide the scope
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          # A push to develop is the authoritative run: it is the only suite
          # that sees the exact merged tree, so it is never narrowed.
          if [ "${{ github.event_name }}" = "push" ]; then
            printf 'mode=full\nspecs=\nreason=merge to develop\n' > scope.txt
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'mode=full\nspecs=\nreason=manual dispatch\n' > scope.txt
          elif [ "${{ github.event_name }}" = "pull_request" ] && \
               [ "${{ contains(github.event.pull_request.labels.*.name, 'e2e:full') }}" = "true" ]; then
            # The label is the only way a person or an agent can overrule the
            # map, and it is recorded on the PR. Free text decides nothing.
            printf 'mode=full\nspecs=\nreason=e2e:full label\n' > scope.txt
          else
            bun scripts/e2e-selection.ts changed.txt > scope.txt
          fi
          cat scope.txt
          mode="$(sed -n 's/^mode=//p' scope.txt)"
          specs="$(sed -n 's/^specs=//p' scope.txt)"
          reason="$(sed -n 's/^reason=//p' scope.txt)"
          echo "e2e_mode=$mode"    >> "$GITHUB_OUTPUT"
          echo "e2e_specs=$specs"  >> "$GITHUB_OUTPUT"
          echo "e2e_reason=$reason" >> "$GITHUB_OUTPUT"
          # `rust` gates the crate. It is true for a path that can end up inside
          # the crate or drive its build.rs: the desktop crate, its scripts, and
          # the sidecar inputs build.rs fingerprints (the api sources and their
          # configs, the contracts package, bun.lock, the root tsconfig and
          # package.json), plus a future rust-toolchain.toml / .cargo config.
          # `*` is the unknown-diff sentinel from the step above.
          if grep -qE '^(\*|apps/desktop/(src-tauri|scripts)/.*|apps/desktop/package\.json|rust-toolchain\.toml|\.cargo/.*|apps/api/(src/.*|package\.json|tsconfig\.json)|packages/contracts/.*|bun\.lock|tsconfig\.base\.json|package\.json)$' changed.txt; then
            echo "rust=true"  >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      # The summary lives here, not in the `e2e` job: a `skip` decision is
      # exactly when that job does not run, so a summary written there would
      # never explain why nothing ran (#231). `always()` still publishes it when
      # the decision itself failed, where the outputs are empty.
      - name: Report the scope decision
        if: always()
        env:
          E2E_MODE: ${{ steps.decide.outputs.e2e_mode }}
          E2E_REASON: ${{ steps.decide.outputs.e2e_reason }}
          E2E_SPECS_OUT: ${{ steps.decide.outputs.e2e_specs }}
          RUST_RUNS: ${{ steps.decide.outputs.rust }}
        run: |
          {
            echo "### CI scope"
            echo ""
            echo "e2e: \`${E2E_MODE:-unknown}\`"
            echo ""
            echo "\`${E2E_REASON:-no reason recorded — the decision may have failed}\`"
            if [ -n "$E2E_SPECS_OUT" ]; then
              echo ""
              echo "Specs: \`$E2E_SPECS_OUT\`"
            fi
            echo ""
            echo "rust: \`${RUST_RUNS:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: typecheck, lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # setup-bun reads packageManager (bun@1.4.3) from package.json,
      # so CI tracks the repo's bun pin without a second source of truth.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # .claude/skills is generated from .agents/skills by
      # scripts/sync-claude-skills.ts. Fail closed if a fix landed in only one
      # copy (the round-2 delta review caught exactly that divergence); the
      # generated mirror may never drift from its source.
      - name: Skills mirror drift
        run: bun run skills:check

      # `turbo test --concurrency=2 && bun test ./scripts/`, so this step also
      # runs scripts/e2e-selection.test.ts: a stale e2e map fails here, in a
      # couple of minutes, instead of quietly disarming the suite.
      - name: Tests
        run: bun run test

      # The gate reads the *checked-out* commit's tests, and actions/checkout
      # leaves a pull_request checkout at refs/pull/N/merge — the merge commit,
      # not head.sha. Passing --head would name a commit this checkout does not
      # hold, and the gate refuses that ("--head ... is not the checked-out
      # commit") on exactly the PRs it exists for: the ones that add a gated test
      # file. The merge commit's tree is the PR's files merged into the base tip,
      # and merge-base(base.sha, merge) is base.sha, so the diff is still the
      # PR's. Checking head out instead would change what every other step in
      # this job proves (the merge result), so the gate uses the checkout it has.
      # timeout-minutes is under the job's 15: a wedged run (a cold install, a
      # hung test) dies here and the build and audit after it still run — a
      # job-level timeout would discard everything after the hang.
      - name: Red-on-parent gate
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        run: bun scripts/red-on-parent.ts --base ${{ github.event.pull_request.base.sha }}

      # The production bundle adds a PR-time `vite build` alongside the one the
      # `rust` job runs for crate-affecting diffs. It is an additional build,
      # not a moved one: `rust` still runs its own, because build.rs hard-fails
      # without apps/web/dist. This step keeps the production build on web-only
      # diffs that skip rust (the e2e job runs `vite dev`, and `turbo test`
      # builds workspace dependencies, not the web app).
      - name: Build web frontend
        run: bun run --filter @dokan/web build

      # Report every advisory, then gate on high/critical only:
      # --audit-level filters what bun counts, and bun exits 1 when any
      # counted advisory remains (bun 1.3.14 behavior).
      - name: Dependency audit
        run: |
          echo "::group::Full audit report (informational)"
          bun audit || true
          echo "::endgroup::"
          bun audit --audit-level=high

  # Separate job so an e2e flake is visible even when `checks` is green,
  # and vice versa. Runs in parallel with `checks` on purpose.
  e2e:
    name: playwright e2e
    needs: changes
    # A skip is not silent: the decision is written to the `changes` job's
    # summary (not this job's — a skip is exactly when this job does not run),
    # and the push-to-develop run always reports `full`. `!cancelled()` (not a
    # bare read of the output) makes a `changes` failure fail closed: an empty
    # `e2e_mode` runs the whole suite instead of skipping it. A skipped job-level
    # gate satisfies a required status check (the check reports `skipped`, which
    # GitHub counts as successful); only a trigger-level `paths:` filter would
    # leave a required check pending (see docs/ci.md).
    if: ${{ !cancelled() && needs.changes.outputs.e2e_mode != 'skip' }}
    runs-on: ubuntu-latest
    # The job budget has to cover SETUP + the run step's own limit + the upload,
    # or a step timeout never fires: the job would cancel first and the evidence
    # would depend on cancellation semantics. Measured setup is ~30s warm, and
    # minutes cold (`playwright install --with-deps` is the bulk), so
    # 6 (cold setup) + 15 (run step) + 4 (upload) = 25 with nothing to spare.
    timeout-minutes: 25
    env:
      # CI-only ports. Never the developer defaults (4317/5173), which other
      # worktrees occupy; an explicit DOKAN_WEB_PORT also makes Vite
      # strictPort, so a clash fails loudly instead of silently moving.
      DOKAN_PORT: "5317"
      DOKAN_WEB_PORT: "6173"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # The scope decision is published by the `changes` job: its step summary is
      # the one place a `skip` decision is visible, because that is exactly when
      # this job does not run (#231).

      - name: Run Playwright e2e
        # pipefail is load-bearing: without it the step exits with tee's status
        # (0), so a red suite would report green and the upload below would not
        # fire. GitHub's default shell is `bash -e {0}`; `-o pipefail` only
        # comes with an explicit `shell: bash`, so the explicit `set` is kept as
        # well — a future edit to `shell:` cannot silently reopen the hole.
        # webServer stdout is piped into this stream by playwright.config.ts
        # (`stdout: "pipe"`), so one file holds the Playwright log and the two
        # Playwright-managed server logs.
        shell: bash
        # Below the JOB's 25 minutes, and deliberately smaller than the room
        # left after setup: a job-level timeout cancels the job, and a cancelled
        # job runs no further steps — the failure evidence would be lost, which
        # is exactly the hang case this upload exists for. Stopping the step
        # first is what lets the upload below still run.
        timeout-minutes: 15
        env:
          # Empty means the whole suite (the `full` and `skip` paths never set
          # specs). Word-split below is intended: each mapped path is one
          # Playwright positional filter.
          E2E_SPECS: ${{ needs.changes.outputs.e2e_specs }}
        run: |
          set -o pipefail
          mkdir -p e2e-logs
          # shellcheck disable=SC2086 -- the spec list must word-split.
          bun run test:e2e $E2E_SPECS 2>&1 | tee e2e-logs/playwright.log

      # Evidence, not a report: a green suite leaves nothing worth 5 days of
      # storage, so success is the one outcome that skips this. #197.
      - name: Upload e2e failure evidence
        # failure() || cancelled(), not bare failure(): GitHub documents that a
        # timeout "kills the process" but not whether the stopped step is then
        # reported as failed or cancelled, and the run step above relies on this
        # firing either way. cancelled() also covers a superseded run.
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # keyed on the attempt: re-running a failed job must not overwrite the
          # evidence from the attempt that actually failed (a build artifact may
          # be replaced by a newer one; a trace may not)
          name: playwright-e2e-failure-${{ github.run_attempt }}
          # test-results/ is Playwright's default output dir: trace.zip, the
          # failure screenshot and error-context.md per failed test.
          path: |
            test-results/
            e2e-logs/
          # a failure before the suite starts leaves nothing here; that step's
          # own error must stay the headline, so a warning beats a second error
          if-no-files-found: warn
          retention-days: 5

  # The Rust capability/permission guards (issue 154). The desktop crate's
  # tests include the guard added in #153: it drives the real tauri-utils
  # URLPattern matcher over setup_navigation_url() and the resolved ACL over
  # capabilities/default.json. A missing remote.urls entry or a missing
  # allow-vault-broker permission silently broke the packaged app once; these
  # tests must gate PRs instead of waiting for the manual/tag release workflow.
  rust:
    name: rust test, clippy
    needs: changes
    # 1,057 of the 2,302 billed minutes in Oct 1-16 were this job (windows at
    # 2x), and most of them ran for diffs that cannot reach the crate. This
    # `if` is the single largest saving in the file. The `changes` job's `rust`
    # output is true for the crate, its scripts, and the sidecar inputs
    # build.rs fingerprints, so a crate, ACL, sidecar or api/contracts change
    # still runs it; only a diff that cannot compile into the crate (web, docs,
    # ci) is skipped. `!cancelled()` makes a `changes` failure fail closed: an
    # empty `rust` runs the crate instead of skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    # windows-latest on purpose: desktop-installer.yml already proves this
    # crate compiles and links there, and the Windows image ships stable Rust,
    # rustup and the WebView2 runtime. A Linux runner would need the
    # webkit2gtk/libsoup Tauri system packages installed via apt before a
    # single test compiles, which is a slower and more fragile gate.
    #
    # Note the price of that choice: windows-latest bills at 2x, so this job's
    # 4 minutes are 8 billed minutes. Moving it to ubuntu would halve its cost;
    # only do that if the apt step stays under the surcharge it replaces.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build.rs compiles the api sidecar with `bun build --compile` and
      # validates tauri.conf.json's `bundle.resources` (apps/web/dist) before
      # cargo compiles a single test, so both Bun and the web build are
      # preconditions of `cargo test`/`cargo clippy`, not extras.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pin stable and pull in clippy. The repo pins no rust-toolchain.toml, so
      # this is the single source of the Rust version for the PR gate (the
      # release workflow uses the image's stable).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      # rust-cache folds the runner OS/arch and the Cargo.lock hash into its
      # own key, so a Windows cache cannot collide with another platform's.
      # cache-on-failure keeps the dependency crates for a re-run after a red
      # test, when they usually compiled fine.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      # tauri.conf.json bundles apps/web/dist as the `ui` resource; build.rs
      # hard-fails when that path is absent, so the frontend must be built
      # before cargo runs (the release workflow gets this from tauri's
      # beforeBuildCommand, which does not run for a bare `cargo test`).
      - name: Build web frontend
        run: bun run --filter @dokan/web build

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings
