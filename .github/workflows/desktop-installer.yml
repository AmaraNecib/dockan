# Desktop installer build (issue 128). Builds the one universal Tauri app
# (ADR-0008: no per-customer build secrets) and uploads the NSIS installer as
# a workflow artifact.
#
# Triggered manually and nightly — never on pull requests, and deliberately
# absent from the required status checks (docs/ci.md), so a slow or broken
# desktop build can never block an ordinary PR. A red run here is a signal
# about the release path, not a merge gate.
#
# Local equivalent:
#   bun install --frozen-lockfile
#   bun run --filter @dokan/desktop installer
#   # -> apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
#
# Action refs are pinned to full commit SHAs (a mutable tag can be moved to
# untrusted code); the trailing comment names the release each SHA is from.
name: Desktop installer

on:
  # Manual run from the Actions tab.
  workflow_dispatch:
  # Nightly, off the top of the hour to dodge the cron stampede.
  schedule:
    - cron: "17 3 * * *"

# One desktop build at a time; a newer run supersedes an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: build tauri installer
    # The Tauri shell and the portable/NSIS deliverables are Windows-only
    # (apps/desktop/scripts/release.ts fails early on POSIX), so the job must
    # run on Windows. The sidecar is compiled for
    # x86_64-pc-windows-msvc regardless of host.
    runs-on: windows-latest
    # A cold Rust release build is slow; the cap is a backstop, not a target.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bun reads packageManager (bun@1.3.14) from package.json, so CI
      # tracks the repo's bun pin without a second source of truth. build.rs
      # shells out to this same bun to compile the api sidecar.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # OS + arch in the key: a Windows/x64 cache must never be restored into
      # a different platform's run (and vice versa).
      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Caches ~/.cargo and the tauri target dir. rust-cache folds the runner
      # OS/arch and the Cargo.lock hash into its own key, so Windows caches
      # cannot collide with another platform's. The windows-latest image ships
      # stable Rust + rustup; the repo pins no rust-toolchain.toml, so CI tracks
      # the image's stable the same way a developer's local stable does.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          # crate dir -> its target dir, relative to the repo root
          workspaces: apps/desktop/src-tauri -> target
          # keep the cache warm even when the build fails: the expensive part
          # (the dependency crates) usually compiled fine before a link error
          cache-on-failure: true

      # The documented release command: compiles the api sidecar (one
      # universal build, no baked secrets — ADR-0008) and runs
      # `tauri build --bundles nsis`, whose beforeBuildCommand builds the web
      # dist. No repository secrets are read.
      - name: Build installer
        run: bun run --filter @dokan/desktop installer

      # A build that quietly produces nothing must fail the job, not upload an
      # empty or absent artifact.
      - name: Verify installer exists and is non-empty
        shell: pwsh
        run: |
          $nsis = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $nsis -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "no NSIS installer produced under $nsis"
          }
          foreach ($installer in $installers) {
            if ($installer.Length -le 0) {
              throw "installer is empty: $($installer.FullName)"
            }
            Write-Host "installer: $($installer.FullName) ($($installer.Length) bytes)"
          }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # run_attempt keeps re-runs from colliding with the first attempt's
          # artifact (upload-artifact v4 rejects a duplicate name).
          name: dokan-installer-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          # belt and braces with the verify step above
          if-no-files-found: error
          retention-days: 14
