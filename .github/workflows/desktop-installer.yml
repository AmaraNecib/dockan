# Desktop release (issue 128; owner round-4 requirements). Builds the one
# universal Tauri app (ADR-0008: no per-customer build secrets) as TWO targets
# — the NSIS installer and the portable folder+zip — and uploads both. A pushed
# version tag additionally publishes a GitHub release with both files attached.
#
# Triggers:
#   - workflow_dispatch: manual, choose all | installer | portable (no release)
#   - push of a v* tag:  builds both targets and publishes a release
# It never runs on a pull request and is deliberately absent from the required
# status checks (docs/ci.md), so it can never block an ordinary PR.
#
# Local equivalent:
#   bun install --frozen-lockfile
#   bun run --filter @dokan/desktop portable
#   bun run --filter @dokan/desktop installer
#
# Action refs are pinned to full commit SHAs (a mutable tag can be moved to
# untrusted code); the trailing comment names the release each SHA is from.
name: Desktop release

on:
  # Manual run from the Actions tab. Never publishes a release.
  workflow_dispatch:
    inputs:
      target:
        description: Which desktop target to build
        type: choice
        options:
          - all
          - installer
          - portable
        default: all
  # A pushed version tag builds both targets and publishes the release.
  push:
    tags:
      - "v*"

# Cancel duplicate runs of the SAME trigger, but never a manual run because a
# tag push (or vice versa) started. `event_name` keeps the trigger streams
# apart; a manual build must survive to upload its artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Only the release job below opts into contents: write.
permissions:
  contents: read

jobs:
  build:
    name: build desktop artifacts
    # The Tauri shell and the portable/NSIS deliverables are Windows-only
    # (apps/desktop/scripts/release.ts fails early on POSIX), so the job must
    # run on Windows. The sidecar is compiled for
    # x86_64-pc-windows-msvc regardless of host.
    runs-on: windows-latest
    # A cold Rust release build is slow; the cap is a backstop, not a target.
    timeout-minutes: 60
    # The resolved version feeds the artifact names and the release job.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bun reads packageManager (bun@1.3.14) from package.json, so CI
      # tracks the repo's bun pin without a second source of truth. build.rs
      # shells out to this same bun to compile the api sidecar.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # OS + arch in the key: a Windows/x64 cache must never be restored into
      # a different platform's run (and vice versa).
      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Version integrity comes before any build: a wrong-version installer is
      # worse than no installer. The version lives in BOTH files and they must
      # agree; on a tag the tag must be v<version> (an optional pre-release
      # suffix is allowed, e.g. v0.2.0-rc.1 for version 0.2.0). The resolved
      # version is published as a step output and in the run summary.
      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          $ErrorActionPreference = "Stop"

          $packageVersion = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (-not $packageVersion -or -not $tauriVersion) {
            throw "could not read the version from apps/desktop/package.json ('$packageVersion') or apps/desktop/src-tauri/tauri.conf.json ('$tauriVersion')"
          }
          if ($packageVersion -ne $tauriVersion) {
            throw "version mismatch: apps/desktop/package.json is '$packageVersion' but apps/desktop/src-tauri/tauri.conf.json is '$tauriVersion' - bump BOTH to the same version"
          }

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVersion = $env:GITHUB_REF -replace "^refs/tags/v", ""
            $escapedVersion = [regex]::Escape($packageVersion)
            if ($tagVersion -ne $packageVersion -and $tagVersion -notmatch "^$escapedVersion-[0-9A-Za-z.-]+$") {
              throw "tag $env:GITHUB_REF does not match the version '$packageVersion' (expected v$packageVersion or v$packageVersion-<prerelease>)"
            }
            Write-Host "tag $env:GITHUB_REF matches version $packageVersion"
          }

          $target = if ($env:GITHUB_EVENT_NAME -eq "push") { "all" } else { "$env:DISPATCH_TARGET" }
          if ($target -notin @("all", "installer", "portable")) {
            throw "unknown target '$target' (expected all, installer or portable)"
          }
          $buildPortable = $target -in @("all", "portable")
          $buildInstaller = $target -in @("all", "installer")

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$packageVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "build_portable=$($buildPortable.ToString().ToLowerInvariant())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "build_installer=$($buildInstaller.ToString().ToLowerInvariant())"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Resolved version: $packageVersion (portable=$buildPortable, installer=$buildInstaller)"
          Write-Host "resolved version $packageVersion; build portable=$buildPortable, build installer=$buildInstaller"

      # Caches ~/.cargo and the tauri target dir. rust-cache folds the runner
      # OS/arch and the Cargo.lock hash into its own key, so Windows caches
      # cannot collide with another platform's. The windows-latest image ships
      # stable Rust + rustup; the repo pins no rust-toolchain.toml, so CI tracks
      # the image's stable the same way a developer's local stable does.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          # crate dir -> its target dir, relative to the repo root
          workspaces: apps/desktop/src-tauri -> target
          # keep the cache warm even when the build fails: the expensive part
          # (the dependency crates) usually compiled fine before a link error
          cache-on-failure: true

      # Portable runs FIRST: release.ts buildPortable removes a stale
      # bundle/nsis before assembling, so running it after the installer would
      # delete the installer. The installer build leaves bundle/portable alone.
      - name: Build portable
        if: steps.version.outputs.build_portable == 'true'
        run: bun run --filter @dokan/desktop portable

      - name: Build installer
        if: steps.version.outputs.build_installer == 'true'
        run: bun run --filter @dokan/desktop installer

      # Both targets are verified BEFORE either is uploaded, so a missing
      # target fails the job instead of leaving a partial success behind.
      - name: Verify portable
        if: steps.version.outputs.build_portable == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portableRoot = "apps/desktop/src-tauri/target/release/bundle/portable"
          $zip = Join-Path $portableRoot "Dokan-portable.zip"
          $folder = Join-Path $portableRoot "Dokan-portable"
          $exe = Join-Path $folder "Dokan-portable.exe"
          foreach ($path in @($zip, $folder, $exe)) {
            if (-not (Test-Path $path)) {
              throw "portable artifact missing: $path"
            }
          }
          if ((Get-Item $zip).Length -le 0) {
            throw "portable zip is empty: $zip"
          }
          if ((Get-Item $exe).Length -le 0) {
            throw "portable exe is empty: $exe"
          }
          Write-Host "portable: $zip ($((Get-Item $zip).Length) bytes) + $folder"

      - name: Verify installer
        if: steps.version.outputs.build_installer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsis = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $nsis -Filter *.exe -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw "no NSIS installer produced under $nsis"
          }
          foreach ($installer in $installers) {
            if ($installer.Length -le 0) {
              throw "installer is empty: $($installer.FullName)"
            }
            Write-Host "installer: $($installer.FullName) ($($installer.Length) bytes)"
          }

      - name: Upload portable
        if: steps.version.outputs.build_portable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dokan-${{ steps.version.outputs.version }}-portable
          path: |
            apps/desktop/src-tauri/target/release/bundle/portable/Dokan-portable.zip
            apps/desktop/src-tauri/target/release/bundle/portable/Dokan-portable
          # fail loudly rather than upload nothing
          if-no-files-found: error
          # a re-run replaces its own artifact instead of colliding
          overwrite: true
          retention-days: 14

      - name: Upload installer
        if: steps.version.outputs.build_installer == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dokan-${{ steps.version.outputs.version }}-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # The ONLY job allowed to write. A manual dispatch never reaches it: the
  # condition requires a pushed v* tag. It attaches the installer .exe and the
  # portable .zip to the GitHub release for that tag.
  release:
    name: publish github release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download portable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Dokan-${{ needs.build.outputs.version }}-portable
          path: dist/portable

      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Dokan-${{ needs.build.outputs.version }}-installer
          path: dist/installer

      - name: Publish release
        shell: bash
        env:
          # the automatic run token, not a repository secret
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # a re-run of the same tag replaces the assets
            gh release upload "${GITHUB_REF_NAME}" \
              dist/installer/*.exe \
              dist/portable/*.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/installer/*.exe \
              dist/portable/*.zip
          fi
