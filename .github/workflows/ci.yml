# Local equivalent:
#   bun install --frozen-lockfile
#   bun run typecheck && bun run lint && bun run test
#   bun audit
#   bunx playwright install --with-deps chromium && bun run test:e2e
#   bun run --filter @dokan/web build
#   (cd apps/desktop/src-tauri && cargo test && cargo clippy -- -D warnings)
#
# Action refs are pinned to full commit SHAs (a mutable tag can be moved to
# untrusted code); the trailing comment names the release each SHA is from.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bun reads packageManager (bun@1.3.14) from package.json,
      # so CI tracks the repo's bun pin without a second source of truth.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      # Report every advisory, then gate on high/critical only:
      # --audit-level filters what bun counts, and bun exits 1 when any
      # counted advisory remains (bun 1.3.14 behavior).
      - name: Dependency audit
        run: |
          echo "::group::Full audit report (informational)"
          bun audit || true
          echo "::endgroup::"
          bun audit --audit-level=high

  # Separate job so an e2e flake is visible even when `checks` is green,
  # and vice versa. Runs in parallel with `checks` on purpose.
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    # The job budget has to cover SETUP + the run step's own limit + the upload,
    # or a step timeout never fires: the job would cancel first and the evidence
    # would depend on cancellation semantics. Measured setup is ~30s warm, and
    # minutes cold (`playwright install --with-deps` is the bulk), so
    # 6 (cold setup) + 15 (run step) + 4 (upload) = 25 with nothing to spare.
    timeout-minutes: 25
    env:
      # CI-only ports. Never the developer defaults (4317/5173), which other
      # worktrees occupy; an explicit DOKAN_WEB_PORT also makes Vite
      # strictPort, so a clash fails loudly instead of silently moving.
      DOKAN_PORT: "5317"
      DOKAN_WEB_PORT: "6173"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright e2e
        # pipefail is load-bearing: without it the step exits with tee's status
        # (0), so a red suite would report green and the upload below would not
        # fire. GitHub's default shell is `bash -e {0}`; `-o pipefail` only
        # comes with an explicit `shell: bash`, so the explicit `set` is kept as
        # well — a future edit to `shell:` cannot silently reopen the hole.
        # webServer stdout is piped into this stream by playwright.config.ts
        # (`stdout: "pipe"`), so one file holds the Playwright log and the two
        # Playwright-managed server logs.
        shell: bash
        # Below the JOB's 25 minutes, and deliberately smaller than the room
        # left after setup: a job-level timeout cancels the job, and a cancelled
        # job runs no further steps — the failure evidence would be lost, which
        # is exactly the hang case this upload exists for. Stopping the step
        # first is what lets the upload below still run.
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p e2e-logs
          bun run test:e2e 2>&1 | tee e2e-logs/playwright.log

      # Evidence, not a report: a green suite leaves nothing worth 5 days of
      # storage, so success is the one outcome that skips this. #197.
      - name: Upload e2e failure evidence
        # failure() || cancelled(), not bare failure(): GitHub documents that a
        # timeout "kills the process" but not whether the stopped step is then
        # reported as failed or cancelled, and the run step above relies on this
        # firing either way. cancelled() also covers a superseded run.
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # keyed on the attempt: re-running a failed job must not overwrite the
          # evidence from the attempt that actually failed (a build artifact may
          # be replaced by a newer one; a trace may not)
          name: playwright-e2e-failure-${{ github.run_attempt }}
          # test-results/ is Playwright's default output dir: trace.zip, the
          # failure screenshot and error-context.md per failed test.
          path: |
            test-results/
            e2e-logs/
          # a failure before the suite starts leaves nothing here; that step's
          # own error must stay the headline, so a warning beats a second error
          if-no-files-found: warn
          retention-days: 5

  # The Rust capability/permission guards (issue 154). The desktop crate's
  # tests include the guard added in #153: it drives the real tauri-utils
  # URLPattern matcher over setup_navigation_url() and the resolved ACL over
  # capabilities/default.json. A missing remote.urls entry or a missing
  # allow-vault-broker permission silently broke the packaged app once; these
  # tests must gate PRs instead of waiting for the manual/tag release workflow.
  rust:
    name: rust test, clippy
    # windows-latest on purpose: desktop-installer.yml already proves this
    # crate compiles and links there, and the Windows image ships stable Rust,
    # rustup and the WebView2 runtime. A Linux runner would need the
    # webkit2gtk/libsoup Tauri system packages installed via apt before a
    # single test compiles, which is a slower and more fragile gate.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build.rs compiles the api sidecar with `bun build --compile` and
      # validates tauri.conf.json's `bundle.resources` (apps/web/dist) before
      # cargo compiles a single test, so both Bun and the web build are
      # preconditions of `cargo test`/`cargo clippy`, not extras.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pin stable and pull in clippy. The repo pins no rust-toolchain.toml, so
      # this is the single source of the Rust version for the PR gate (the
      # release workflow uses the image's stable).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      # rust-cache folds the runner OS/arch and the Cargo.lock hash into its
      # own key, so a Windows cache cannot collide with another platform's.
      # cache-on-failure keeps the dependency crates for a re-run after a red
      # test, when they usually compiled fine.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      # tauri.conf.json bundles apps/web/dist as the `ui` resource; build.rs
      # hard-fails when that path is absent, so the frontend must be built
      # before cargo runs (the release workflow gets this from tauri's
      # beforeBuildCommand, which does not run for a bare `cargo test`).
      - name: Build web frontend
        run: bun run --filter @dokan/web build

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings
