# Local equivalent:
#   bun install --frozen-lockfile
#   bun run typecheck && bun run lint && bun run test
#   bun audit
#   bunx playwright install --with-deps chromium && bun run test:e2e
#
# Action refs are pinned to full commit SHAs (a mutable tag can be moved to
# untrusted code); the trailing comment names the release each SHA is from.
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bun reads packageManager (bun@1.3.14) from package.json,
      # so CI tracks the repo's bun pin without a second source of truth.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      # Report every advisory, then gate on high/critical only:
      # --audit-level filters what bun counts, and bun exits 1 when any
      # counted advisory remains (bun 1.3.14 behavior).
      - name: Dependency audit
        run: |
          echo "::group::Full audit report (informational)"
          bun audit || true
          echo "::endgroup::"
          bun audit --audit-level=high

  # Separate job so an e2e flake is visible even when `checks` is green,
  # and vice versa. Runs in parallel with `checks` on purpose.
  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only ports. Never the developer defaults (4317/5173), which other
      # worktrees occupy; an explicit DOKAN_WEB_PORT also makes Vite
      # strictPort, so a clash fails loudly instead of silently moving.
      DOKAN_PORT: "5317"
      DOKAN_WEB_PORT: "6173"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: bun run test:e2e
