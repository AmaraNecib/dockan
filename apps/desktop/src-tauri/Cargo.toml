[package]
name = "dokan"
version = "0.1.0"
description = "Dokan — desktop stock & invoicing app"
edition = "2021"

[lib]
name = "dokan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dokan-sidecar-freshness = { path = "sidecar-freshness" }

[dev-dependencies]
dokan-sidecar-freshness = { path = "sidecar-freshness" }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# one-time boot-token entropy for sidecar identity verification (PR #51 finding 1)
getrandom = "0.3"

[profile.release]
strip = true
lto = true
